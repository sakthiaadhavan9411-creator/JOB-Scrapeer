# Enable and configure at least one source before running.
google_alerts:
  enabled: true
  feed_urls:
    - "https://www.google.com/alerts/feeds/10959493450765435756/5043838230129375759"
apify:
  enabled: false
  timeout_seconds: 300
  poll_seconds: 5
  fields:
    url_field: linkedinUrl
    author_field: author.name
    text_field: content
    date_field: postedAt.date
include_keywords: [hiring, recruiting, vacancy, vacancies, opening, "join our team", "join us", "looking for", "apply now", "we are seeking"]
exclude_keywords: []
max_messages_per_run: 15
state_path: state/alerts.sqlite3

# Require a target role as well as a hiring keyword; remote and on-site both qualify.
role_keywords:
  - "operations analyst"
  - "business operations associate"
  - "business analyst"
  - "project coordinator"
  - "program coordinator"
  - "PMO analyst"
  - "product analyst"
  - "associate product analyst"
  - "management trainee"
  - "implementation associate"
  - "implementation executive"
  - "customer operations"
  - "support operations associate"
  - "supply chain coordinator"
  - "logistics coordinator"
  - "office manager"
  - "admin operations coordinator"
  - "founder's office"
  - "founders office"
  - "founder office"
  - "founders' office"
  - "founder’s office"
  - "strategy and operations associate"
  - "strategy & operations associate"
  - "associate project manager"
  - "executive assistant"
